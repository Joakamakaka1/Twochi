[project]
name = "twochi-data"
version = "0.1.0"
description = "Postgres repositories with hand-written SQL."
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31",
    "twochi-application",
    "twochi-domain",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
twochi-application = { workspace = true }
twochi-domain = { workspace = true }

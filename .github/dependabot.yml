# Weekly updates for the four ecosystems (CI/CD e IaC). Each waits seven days before
# proposing a release, like exclude-newer in uv and minimumReleaseAge in pnpm.
# Dependabot PRs run without secrets or OIDC.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: terraform
    directories:
      - /infra/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

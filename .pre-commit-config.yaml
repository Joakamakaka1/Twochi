# Fast local guards: secrets, Python format and lint. Run with `uvx pre-commit@4.7.0`.
# Hooks are pinned to a commit; keep the ruff rev in step with ruff in uv.lock.
# `just setup` installs the three hook types; every hook runs before the commit but
# `just check`, which runs before a push, and the Supabase IDs guard also reads the
# commit message.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  # The linked Supabase project's ref and organization IDs never enter git (TWO-40).
  # Read from the gitignored supabase/.temp, so CI, which has none, compares nothing.
  # Every file type: the script reads raw bytes, and UTF-16 files count as binary.
  # It runs on the project's own Python 3.14 through uv, as `just` does; pre-commit's
  # Python is older and rejects 3.14 syntax.
  - repo: local
    hooks:
      - id: supabase-project-ids
        name: No linked Supabase project IDs
        language: system
        entry: uv run --locked python .github/scripts/project_ref_guard.py
        stages: [pre-commit, commit-msg]
      # A slot's supabase/config.toml (another project_id, ports off 553xx) never enters
      # a commit, even when its skip-worktree mark is lost (TWO-43).
      - id: supabase-slot-config
        name: No slot's Supabase config
        language: system
        entry: uv run --locked python scripts/slot.py guard
        files: ^supabase/config\.toml$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-format
      - id: ruff-check
  # Before a push, the whole `just check`, the same steps as CI (TWO-26): PR 9 was
  # pushed with it failing. It checks the checkout, not the pushed refs, takes about
  # three minutes, needs local Supabase (`just up`) and ends with `supabase db reset`.
  # The rule is not to skip it; `git push --no-verify` only when this same tree has just
  # passed `just check` in full.
  - repo: local
    hooks:
      - id: just-check
        name: just check
        language: system
        entry: just check
        pass_filenames: false
        always_run: true
        stages: [pre-push]

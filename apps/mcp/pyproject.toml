[project]
name = "twochi-mcp"
version = "0.1.0"
description = "Admin MCP server."
requires-python = ">=3.14"
dependencies = ["twochi-application", "twochi-domain", "twochi-data"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
twochi-application = { workspace = true }
twochi-domain = { workspace = true }
twochi-data = { workspace = true }
